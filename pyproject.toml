[project]
name = "rocky"
version = "0.1.0"
description = "Sonifies live agent activity from AG-UI events"
requires-python = ">=3.12"
dependencies = ["ag-ui-protocol>=0.1.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocky"]
